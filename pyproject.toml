[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqanalysis-viewer"
version = "0.1.0"
description = "A modern molecular trajectory viewer built on PQAnalysis."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "fastapi>=0.115.12,<1",
    "numpy>=2,<3",
    "PQAnalysis>=1.3.0",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ase = [
    "ase>=3.23,<4",
]
render = [
    "playwright>=1.52,<2",
]
dev = [
    "ase>=3.23,<4",
    "httpx2>=2,<3",
    "pillow>=11,<13",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
pqviewer = "pqviewer.cli:main"
pqviewer-render = "pqviewer.render_cli:main"

[project.urls]
Repository = "https://github.com/MolarVerse/PQViewer"

[tool.setuptools.packages.find]
include = ["pqviewer*"]

[tool.setuptools.package-data]
pqviewer = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

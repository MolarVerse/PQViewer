[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molarverse-pqviewer"
version = "0.1.0"
description = "Interactive molecular structure and trajectory viewing for PQ."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "fastapi>=0.115.12,<1",
    "numpy>=2,<3",
    "PQAnalysis>=1.4.0",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ase = [
    "ase>=3.23,<4",
]
render = [
    "playwright>=1.52,<2",
]
jupyter = [
    "ipython>=8,<10",
]
docs = [
    "furo>=2024.8.6,<2027",
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-design>=0.6,<1",
]
dev = [
    "ase>=3.23,<4",
    "httpx2>=2,<3",
    "pillow>=11,<13",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[project.scripts]
pqviewer = "pqviewer.cli:main"
pqviewer-render = "pqviewer.render_cli:main"

[project.urls]
Repository = "https://github.com/MolarVerse/PQViewer"
Documentation = "https://molarverse.github.io/PQViewer/"
Changelog = "https://github.com/MolarVerse/PQViewer/blob/main/CHANGELOG.md"
Issues = "https://github.com/MolarVerse/PQViewer/issues"

[tool.setuptools.packages.find]
include = ["pqviewer*"]

[tool.setuptools.package-data]
pqviewer = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: Bug report
description: Report a reproducible viewer, data, or rendering problem.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use the smallest redistributable fixture possible. Do not attach confidential simulation data or security-sensitive details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, input type, and minimal steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit, or branch.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, browser, and graphics hardware.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe logs, screenshots, or a link to a small fixture.

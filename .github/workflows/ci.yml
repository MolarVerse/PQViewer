name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check packages
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          sdist=$(find dist -name '*.tar.gz' -print -quit)
          python scripts/verify_distribution.py "$wheel" "$sdist"
          python -m venv /tmp/pqviewer-smoke
          /tmp/pqviewer-smoke/bin/pip install "$wheel"
          cd /tmp
          /tmp/pqviewer-smoke/bin/pqviewer --help
          /tmp/pqviewer-smoke/bin/pqviewer render --help
          /tmp/pqviewer-smoke/bin/pqviewer-render --help

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PQViewer/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: PQViewer
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: PQViewer/frontend/package-lock.json
      - run: npm ci
      - name: Verify shared terminal source and tokens
        working-directory: PQViewer
        run: |
          cmp frontend/node_modules/@molarverse/pq-design/python/pq_terminal.py pqviewer/_design_terminal.py
          cmp frontend/node_modules/@molarverse/pq-design/tokens.json pqviewer/_design_tokens.json
      - run: npm run build
      - name: Run frontend tests when available
        run: npm run test --if-present
      - name: Verify bundled frontend
        working-directory: PQViewer
        run: git diff --exit-code -- pqviewer/static

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PQViewer
    steps:
      - uses: actions/checkout@v7
        with:
          path: PQViewer
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,render]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: PQViewer/frontend/package-lock.json
      - working-directory: PQViewer/frontend
        run: npm ci
      - working-directory: PQViewer/frontend
        run: npx playwright install --with-deps chromium
      - run: python -m playwright install chromium
      - working-directory: PQViewer/frontend
        run: npm run test:e2e
      - name: Smoke-test headless rendering
        env:
          PQVIEWER_HEADLESS_TEST: "1"
        run: python -m pytest tests/test_recipe.py -k headless_render_command
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: output/playwright
          if-no-files-found: ignore

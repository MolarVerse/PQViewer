name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Check wheel
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m zipfile -l "$wheel" | grep -q 'pqviewer/static/index.html'
          python -m venv /tmp/pqviewer-smoke
          /tmp/pqviewer-smoke/bin/pip install "$wheel"
          cd /tmp
          /tmp/pqviewer-smoke/bin/pqviewer --help

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run frontend tests when available
        run: npm run test --if-present
      - name: Verify bundled frontend
        working-directory: .
        run: git diff --exit-code -- pqviewer/static

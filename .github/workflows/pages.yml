name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install documentation dependencies
        run: python -m pip install '.[docs,ase]'
      - name: Build documentation
        run: >-
          python -m sphinx -W --keep-going -b html
          -d _build/doctrees
          docs _site
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build fixed-dataset viewer
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE_PATH: /PQViewer/viewer/
          PQVIEWER_OUT_DIR: ../_site/viewer
        run: npm run build
      - name: Pack the perovskite demo
        run: >-
          python scripts/build_static_demo.py
          examples/strontium-titanate.extxyz
          _site/viewer/demo
      - name: Prepare Pages
        run: touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

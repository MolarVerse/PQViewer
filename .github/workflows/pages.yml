name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install documentation dependencies
        run: python -m pip install '.[docs,ase]'
      - name: Build documentation
        run: python -m sphinx -W -b html docs _site
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build read-only viewer
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE_PATH: /PQViewer/viewer/
          PQVIEWER_OUT_DIR: ../_site/viewer
        run: npm run build
      - name: Pack the perovskite demo
        run: python scripts/build_static_demo.py examples/strontium-titanate.extxyz _site/viewer/demo
      - name: Prepare Pages
        run: touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
